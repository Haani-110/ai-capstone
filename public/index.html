<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Settings</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Project Settings</h1>
        <p>Configure your capstone development preferences.</p>
      </header>

      <form id="settings-form" novalidate>
        <div class="field">
          <label for="developerName">Developer name</label>
          <input
            id="developerName"
            name="developerName"
            type="text"
            autocomplete="name"
            required
            minlength="2"
            maxlength="50"
            placeholder="Syed Haani Raza"
          />
          <p class="error" data-error-for="developerName"></p>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            placeholder="you@example.com"
          />
          <p class="error" data-error-for="email"></p>
        </div>

        <div class="field">
          <label for="editorTheme">Editor theme</label>
          <select id="editorTheme" name="editorTheme" required>
            <option value="">Select a theme</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="system">System</option>
          </select>
          <p class="error" data-error-for="editorTheme"></p>
        </div>

        <div class="field">
          <label for="commitPrefix">Default commit prefix</label>
          <select id="commitPrefix" name="commitPrefix">
            <option value="">None</option>
            <option value="feat">feat</option>
            <option value="fix">fix</option>
            <option value="docs">docs</option>
            <option value="chore">chore</option>
            <option value="refactor">refactor</option>
            <option value="test">test</option>
          </select>
          <p class="error" data-error-for="commitPrefix"></p>
        </div>

        <div class="field field--checkbox">
          <label>
            <input id="enableAiSuggestions" name="enableAiSuggestions" type="checkbox" />
            Enable AI suggestions
          </label>
        </div>

        <div class="actions">
          <button type="submit">Save settings</button>
        </div>

        <p id="form-status" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
